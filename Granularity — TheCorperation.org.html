.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}

  "blog-mfa": { title:"MFA Gaps", crumb:"Blog / MFA Gaps", html: `
    <div class="page container"><h2>Why Your MFA Rollout Probably Has a Gap</h2>
    <p>A walkthrough of the three most common MFA bypass patterns we see in engagements: push-fatigue, SIM-swap-adjacent recovery flows, and legacy protocol fallback that nobody remembered to disable. None of these are exotic — all three show up in nearly every engagement where MFA is "done."</p>
    <p>Push-fatigue remains the easiest win for an attacker and the hardest for a defender to fully close, since it exploits a human decision rather than a technical flaw. We typically see it succeed within the first two or three attempts once a target's phone number is confirmed. The fix isn't more training alone — number-matching push approval closes most of the gap on its own.</p>
    <p>Legacy protocol fallback is the quieter problem. IMAP, POP, and older SMTP auth paths frequently sit unmonitored even after an org has rolled out modern MFA everywhere else, because nobody audits the protocols a mail server still technically accepts. We flag this in roughly half of our engagements against organizations that consider their MFA rollout "complete."</p>
    <p>If there's one takeaway, it's that MFA coverage should be measured by protocol, not by application — a login page can be fully covered while an old mail protocol sitting one layer down is wide open.</p>
    <p>We also recommend a periodic audit of break-glass accounts — the emergency admin logins that bypass MFA by design. These accounts are supposed to be rare and tightly controlled, but in practice they're one of the first things we check, because they're forgotten about far more often than they're actually used.</p></div>`
  },
  "blog-redteam": { title:"Failed Phish", crumb:"Blog / Failed Phish", html: `
    <div class="page container"><h2>Red Team Lessons from a Failed Phish</h2>
    <p>Not every pretext lands. Here's what we learned the one time our social engineering attempt got reported immediately — and why, from a program-health standpoint, that's actually the result you want to see more of.</p>
    <p>The pretext itself wasn't bad — a plausible IT migration notice, timed to land during a real internal system change the client had mentioned in scoping. What tripped it up was a single inconsistency in the sender domain that one sharp employee caught and reported within four minutes of send. We've since started stress-testing our own pretexts against a "what's the one thing a careful person would notice" pass before launch.</p>
    <p>The real finding wasn't the phish failing — it was how the report made its way through the organization afterward. It took almost three hours for that initial report to reach the security team, routed through two unrelated channels first. That lag, not the phishing attempt itself, became the headline finding in our report.</p>
    <p>We've started recommending clients run a tabletop specifically on "what happens after someone reports a phish," separate from the phishing test itself — the reporting pipeline is usually the bigger gap.</p>
    <p>Worth saying too: the employee who caught it got a direct thank-you note from the client's CISO, which we think did more for the security culture there than any training module could have. Recognition matters more than most security programs budget for.</p></div>`
  },
  "blog-reports": { title:"Reading Reports", crumb:"Blog / Reading Reports", html: `
    <div class="page container"><h2>Reading a Pentest Report Like an Engineer</h2>
    <p>A guide for technical teams on triaging findings by exploitability rather than by CVSS score alone — because a 9.8 that requires physical console access is not the same emergency as a 6.5 that's exposed to the internet.</p>
    <p>We structure every report with an "attack path" section specifically so a reader doesn't have to reconstruct exploitability themselves from a flat list of CVEs. If a finding only matters when chained with two other findings, we say so explicitly, and we rank the chain rather than each link individually.</p>
    <p>The other habit worth adopting: read the remediation section before the findings section. It reframes the whole report around what you're going to do about it, rather than how bad it sounds in isolation.</p>
    <p>We also recommend assigning an internal owner to each finding at readout time, while the context is still fresh — findings that don't get an owner on day one have a way of quietly aging into next year's audit.</p>
    <p>One more habit worth stealing: ask your tester which finding they'd fix first if they could only pick one. It's rarely the highest-scored item on paper, and the answer usually tells you more about real-world risk than the CVSS column does.</p></div>`
  },
  "blog-scoping": { title:"Scoping", crumb:"Blog / Scoping", html: `
    <div class="page container"><h2>What Our Clients Get Wrong About Scoping</h2>
    <p>The most common scoping mistake isn't too narrow — it's too vague. Some thoughts on writing a rules-of-engagement doc that actually protects both sides of the engagement.</p>
    <p>"Test our external footprint" sounds reasonable until testing day, when it turns out nobody agreed on whether that includes a third-party-hosted marketing site, or a staging environment that's technically internet-reachable. We now require a literal asset list signed off by both sides before kickoff, no exceptions, regardless of how long the client has worked with us.</p>
    <p>The second most common mistake is scoping the test around compliance requirements rather than actual risk. A checkbox-driven scope tends to miss exactly the things an attacker would actually go after, because auditors and attackers are optimizing for different things.</p>
    <p>A smaller but recurring issue: clients under-scoping the social engineering piece out of discomfort, then being surprised when the technical findings alone don't tell the full story. We try to normalize this in the first scoping call rather than letting it become an awkward negotiation later.</p>
    <p>Last thing: scope documents should name an escalation contact on both sides, reachable in real time during testing hours. We've had engagements stall for a full day because a critical finding needed a go/no-go decision and nobody on the client side was reachable. It's a small line item that saves a lot of pain.</p></div>`
  },

/* ---------- job board rendering ---------- */
function jobRowHTML(j){
  const statusLabel = j.status === "filled" ? "Filled" : "Open";
  const statusClass = j.status === "filled" ? "status filled" : "status";
  return `<div class="jobrow" onclick="go('job-${j.id}')">
    <div><strong>${j.title}</strong><div class="meta">${j.dept} · ${j.loc} · ${j.type}</div></div>
    <span class="${statusClass}">${statusLabel}</span>
  </div>`;
}
function renderJobs(){
  const list = document.getElementById("jobList");
  if(!list) return;
  const q = (document.getElementById("jobSearch").value || "").toLowerCase();
  const dept = document.getElementById("jobDept").value;
  const filtered = JOBS.filter(j => j.title.toLowerCase().includes(q) && (!dept || j.dept === dept));
  list.innerHTML = filtered.length ? filtered.map(jobRowHTML).join("") : '<p style="color:var(--muted);font-size:14px">No roles match.</p>';
}

    <p>${job.desc}</p>
    <h3 class="sechead">What the role covers</h3>
    <p style="color:var(--muted);font-size:14.5px">Day to day work varies by quarter depending on active engagements, but generally includes close coordination with the delivery team, documentation, and process upkeep appropriate to the role.</p>
    ${job.status === "filled" ? `
    <h3 class="sechead">Posting history</h3>
    <p style="color:var(--muted);font-size:14.5px">This posting stayed up longer than intended after the role was filled — leaving it as-is for now rather than editing it down.</p>
    ${flagbox('f9','🗂 Leftover note on this posting — click to view')}
    ` : ``}
  </div>`;
}

/* ---------- portal ---------- */
const CRED_HASHES = {
  "31cd361906da687145d9388a8b981cedc5d07decde474f9bef24364787f46fcd": {level:1, name:"Marcus Whitfield (HR)"},
  "0b54ba499b015209f84de1f445e0c8235dfb319dc2fd118db9b3183e91b902aa": {level:2, name:"Priya Suresh (Engineering)"},
  "8ab4345d22b7be1a3fca599fdde58abaa6974de091cc1ceaf7b745db7e9d8b3e": {level:3, name:"Daniel Reyes (VP)"}
};
const REQUIRED_LEVEL = 1;
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function portalHTML(){
  return `<div class="page container">
    <div class="login-box" id="loginBox">
      <h2>Staff Portal</h2>
      <p>Internal access only. Sign in with your Granularity credentials.</p>
      <label for="u">Username</label><input type="text" id="u" autocomplete="off" spellcheck="false">
      <label for="p">Password</label><input type="password" id="p" autocomplete="off">
      <button onclick="attemptLogin()">Sign in</button>
      <div class="login-msg" id="loginMsg"></div>
    </div>
    <div class="unlocked" id="unlockedBox">
      <div class="card">
        <h3 id="welcomeMsg"></h3>
        <p>You're in. Staff bulletin: HVAC maintenance scheduled for the server closet this weekend — expect brief monitoring gaps. Also, a reminder from facilities: please stop propping the loading-dock door open, it trips the badge-reader logs.</p>
        <p style="margin-top:12px">Other notices: the Q3 expense report deadline moved up a week, parking passes need to be renewed by the end of the month at the front desk, and the kitchen coffee machine is being serviced Thursday — bring your own if that's a dealbreaker.</p>
        <p style="margin-top:12px">Nothing else lives in this portal yet — most day-to-day work happens in LiveCorp's operational tools.</p>
      </div>
    </div>
  </div>`;
}
async function attemptLogin(){
  const u = document.getElementById("u").value.trim();
  const p = document.getElementById("p").value;
  const msg = document.getElementById("loginMsg");
  if(!u || !p){ return; }
  const hash = await sha256(u + "|" + p);
  const match = CRED_HASHES[hash];
  if(!match){ msg.textContent = "Invalid credentials."; msg.className = "login-msg bad"; return; }
  if(match.level < REQUIRED_LEVEL){ msg.textContent = "Credentials valid, but insufficient clearance for this portal."; msg.className = "login-msg bad"; return; }
  msg.textContent = "";
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("welcomeMsg").textContent = "Welcome back, " + match.name + ".";
  document.getElementById("unlockedBox").classList.add("show");
}
async function attemptBlogUnlock(){
  const u = document.getElementById("blogU").value.trim();
  const p = document.getElementById("blogP").value;
  const msg = document.getElementById("blogMsg");
  if(!u || !p){ return; }
  const hash = await sha256(u + "|" + p);
  const match = CRED_HASHES[hash];
  if(!match || match.level < 1){
    msg.textContent = "Invalid credentials.";
    msg.className = "login-msg bad";
    return;
  }
  msg.textContent = "";
  const reveal = document.getElementById("blogFlagReveal");
  reveal.style.display = "block";
  reveal.textContent = "Flag: " + atob(FLAGS.f4);
}

/* ---------- router ---------- */
function go(hash){ location.hash = hash; }
function render(){
  const hash = (location.hash || "#home").replace("#","");
  const app = document.getElementById("app");
  const crumbWrap = document.getElementById("crumb-wrap");

  if(hash === "portal"){
    app.innerHTML = portalHTML();
    document.title = "Staff Portal — Granularity";
    crumbWrap.style.display = "block";
    document.getElementById("crumb").innerHTML = '<a onclick="go(\'home\')">Home</a> / Staff Portal';
    window.scrollTo(0,0);
    return;
  }

  if(hash.startsWith("job-")){
    const job = JOBS.find(j => "job-" + j.id === hash);
    if(job){
      app.innerHTML = jobDetailHTML(job);
      document.title = job.title + " — Granularity";
      crumbWrap.style.display = "block";
      document.getElementById("crumb").innerHTML = '<a onclick="go(\'home\')">Home</a> / <a onclick="go(\'careers\')">Careers</a> / ' + job.title;
      window.scrollTo(0,0);
      return;
    }
  }

  if(PAGES[hash]){
    const page = PAGES[hash];
    app.innerHTML = page.html;
    document.title = page.title + " — Granularity";
    if(page.crumb){
      crumbWrap.style.display = "block";
      document.getElementById("crumb").innerHTML = '<a onclick="go(\'home\')">Home</a> / ' + page.crumb;
    } else {
      crumbWrap.style.display = "none";
    }
    if(hash === "careers"){ renderJobs(); }
    window.scrollTo(0,0);
    return;
  }

  if(DECOY_CONTENT[hash]){
    app.innerHTML = decoyHTML(hash);
    document.title = DECOY_CONTENT[hash].title + " — Granularity";
    crumbWrap.style.display = "block";
    document.getElementById("crumb").innerHTML = '<a onclick="go(\'home\')">Home</a> / ' + DECOY_CONTENT[hash].title;
    window.scrollTo(0,0);
    return;
  }

  app.innerHTML = PAGES.home.html;
  document.title = "Home — Granularity";
  crumbWrap.style.display = "none";
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", render);
render();
</script>
